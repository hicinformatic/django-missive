[flake8]
max-line-length = 88
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    venv,
    .venv,
    migrations
ignore = E203, E266, E501, W503
per-file-ignores =
    __init__.py:F401

[coverage:run]
source = missive
omit = 
    */migrations/*
    */tests/*
    */test_*.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

