[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-missive"
version = "0.1.0"
description = "A Django library for missive management"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["django", "missive"]
requires-python = ">=3.8"
dependencies = [
    "Django>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12",
    "mypy>=1.0",
    "bandit>=1.7",  # Security linter
    "safety>=3.0",  # Dependency vulnerability scanner
    "pip-audit>=2.6",  # PyPI vulnerability auditor
    "vulture>=2.10",  # Dead code detector
    "autoflake>=2.2",  # Remove unused imports and variables
    "pylint>=3.0",  # Code quality and redundancy checker
    "radon>=6.0",  # Complexity metrics
]

# Providers Email
email = [
    "sendgrid>=6.11",
    "mailgun>=0.1.1",
    "boto3>=1.28",  # Amazon SES
]

# Providers SMS et Vocal
sms = [
    "twilio>=8.10",
    "vonage>=3.11",
]

# Providers Messageries instantanées
messaging = [
    "python-telegram-bot>=20.7",
    "requests>=2.31",  # Pour Signal, Messenger
]

# Providers Notifications push
push = [
    "firebase-admin>=6.3",  # FCM
    "aioapns>=3.1",  # Apple Push Notification
]

# Providers Messageries professionnelles
professional = [
    "slack-sdk>=3.26",
    "msgraph-core>=1.0",  # Microsoft Teams/Graph API
]

# Providers Courrier
postal = [
    "requests>=2.31",  # La Poste, LRE (AR24)
    "reportlab>=4.0",  # Génération PDF pour courrier
]

# Toutes les dépendances optionnelles
all = [
    "sendgrid>=6.11",
    "mailgun>=0.1.1",
    "boto3>=1.28",
    "twilio>=8.10",
    "vonage>=3.11",
    "python-telegram-bot>=20.7",
    "requests>=2.31",
    "firebase-admin>=6.3",
    "aioapns>=3.1",
    "slack-sdk>=3.26",
    "msgraph-core>=1.0",
    "reportlab>=4.0",
    "phonenumbers>=8.13",  # Validation numéros de téléphone
    "email-validator>=2.1",  # Validation emails
]

[project.urls]
Homepage = "https://github.com/yourusername/django-missive"
Documentation = "https://github.com/yourusername/django-missive#readme"
Repository = "https://github.com/yourusername/django-missive"
"Bug Tracker" = "https://github.com/yourusername/django-missive/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["missive*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

