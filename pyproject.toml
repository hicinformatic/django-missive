[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pymissive"
version = "0.1.0"
description = "Django library for multi-channel missive management (email, SMS, push, postal, etc.)"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["django", "missive"]
requires-python = ">=3.8"
dependencies = [
    "Django>=3.2",
    "django-phonenumber-field[phonenumbers]>=7.0",
    "babel>=2.0",
    "pymissive>=0.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing framework
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    # Testing utilities
    "pytest-xdist>=3.0",  # Parallel test execution
    "pytest-mock>=3.10",  # Better mocking support
    "pytest-timeout>=2.1",  # Detect slow/hanging tests
    "pytest-sugar>=0.9",  # Improved test output
    "pytest-html>=3.1",  # HTML test reports
    "pytest-randomly>=3.12",  # Random test execution order
    "pytest-repeat>=0.9",  # Repeat tests to find flaky tests
    # Test data generation
    "factory-boy>=3.3",  # Django model factories
    "faker>=19.0",  # Generate realistic fake data
    "hypothesis>=6.68",  # Property-based testing
    # Code quality
    "ruff>=0.5",
    "black>=23.0",
    "flake8>=6.0",
    "flake8-simplify>=0.21",
    "flake8-docstrings>=1.7",
    "isort>=5.12",
    "mypy>=1.0",
    "django-stubs>=5.0.0",
    "django-stubs-ext>=5.0.0",
    # Security
    "bandit>=1.7",  # Security linter
    "safety>=3.0",  # Dependency vulnerability scanner
    "pip-audit>=2.6",  # PyPI vulnerability auditor
    "semgrep>=1.94",  # SAST scans
    # Code cleanup
    "vulture>=2.10",  # Dead code detector
    "autoflake>=2.2",  # Remove unused imports and variables
    "pylint>=3.0",  # Code quality and redundancy checker
    "radon>=6.0",  # Complexity metrics
]

# Providers Email
email = [
    "sendgrid>=6.11",
    "mailgun>=0.1.1",
    "boto3>=1.28",  # Amazon SES
]

# Providers SMS et Vocal
sms = [
    "twilio>=8.10",
    "vonage>=3.11",
]

# Instant messaging providers
messaging = [
    "python-telegram-bot>=20.7",
    "requests>=2.31",  # For Signal, Messenger
]

# Push notification providers
push = [
    "firebase-admin>=6.3",  # FCM
    "aioapns>=3.1",  # Apple Push Notification
]

# Professional messaging providers
professional = [
    "slack-sdk>=3.26",
    "msgraph-core>=1.0",  # Microsoft Teams/Graph API
]

# Postal providers
postal = [
    "requests>=2.31",  # La Poste, LRE (AR24)
    "reportlab>=4.0",  # PDF generation for mail
]

# All optional dependencies
all = [
    "sendgrid>=6.11",
    "mailgun>=0.1.1",
    "boto3>=1.28",
    "twilio>=8.10",
    "vonage>=3.11",
    "python-telegram-bot>=20.7",
    "requests>=2.31",
    "firebase-admin>=6.3",
    "aioapns>=3.1",
    "slack-sdk>=3.26",
    "msgraph-core>=1.0",
    "reportlab>=4.0",
    "phonenumbers>=8.13",  # Validation numéros de téléphone
    "email-validator>=2.1",  # Validation emails
]

[project.urls]
Homepage = "https://github.com/yourusername/django-missive"
Documentation = "https://github.com/yourusername/django-missive#readme"
Repository = "https://github.com/yourusername/django-missive"
"Bug Tracker" = "https://github.com/yourusername/django-missive/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["djpymissive*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "pymissive.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "providerkit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "virtualqueryset.*"
ignore_missing_imports = true

# Ignore TextChoices.choices, admin short_description, and untyped imports
[[tool.mypy.overrides]]
module = "djpymissive.*"
disable_error_code = ["attr-defined", "import-untyped", "import-not-found"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "djpymissive.models.*"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "djpymissive.admin.*"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "djpymissive.models.document"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "djpymissive.models.recipient"
disable_error_code = ["misc", "assignment"]

[[tool.mypy.overrides]]
module = "djpymissive.migrations.*"
ignore_missing_imports = true

[tool.pylint.main]
ignore = ["migrations"]

[tool.pylint.messages_control]
disable = [
    "C0111", "C0103", "R0903",  # Already in qualitybase
    "C0415",   # import-outside-toplevel (Django lazy imports)
    "E1101",   # no-member (Django ORM dynamic attributes)
    "R0801",   # duplicate-code
    "R0401",   # cyclic-import
    "C0411",   # wrong-import-order
    "C0301", "C0302", "C0303", "C0304",  # line-length, lines
    "C0201",   # consider-iterating-dictionary
    "W0622",   # redefined-builtin
    "W0212",   # protected-access
    "C0412",   # ungrouped-imports
    "E0401",   # import-error (optional deps: celery, django_rq)
    "E0307",   # invalid-str-returned
    "E1136",   # unsubscriptable-object
    "E1111",   # assignment-from-no-return
]

[tool.vulture]
ignore_names = ["commit"]

[tool.django-stubs]
django_settings_module = "tests.settings"

